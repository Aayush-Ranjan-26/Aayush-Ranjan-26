<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="GitHub telemetry for Aayush-Ranjan-26">
  <defs>
    <clipPath id="tp"><rect width="1000" height="210" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tp)">
    <rect width="1000" height="210" rx="14" fill="#0d1117"/>
    <rect x="0.5" y="0.5" width="999" height="209" rx="14" fill="none" stroke="#21304a"/>
    <text x="32" y="36" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13" fill="#6e7681">$ gh api users/Aayush-Ranjan-26 --stats</text>

    <g>
      <circle cx="155" cy="108" r="42" fill="none" stroke="#161b22" stroke-width="7"/>
      <circle cx="155" cy="108" r="42" fill="none" stroke="#3fb950" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 155 108)">
        <animate attributeName="stroke-dashoffset" values="263.9;0" dur="1.2s" begin="0.25s" fill="freeze"/>
      </circle>
      <text x="155" y="118" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="30" font-weight="700"
            fill="#e6edf3" opacity="0">11
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.85s" fill="freeze"/>
      </text>
      <text x="155" y="176" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13" fill="#8b949e" opacity="0">repositories
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.05s" fill="freeze"/>
      </text>
    </g>

    <g>
      <circle cx="385" cy="108" r="42" fill="none" stroke="#161b22" stroke-width="7"/>
      <circle cx="385" cy="108" r="42" fill="none" stroke="#58a6ff" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 385 108)">
        <animate attributeName="stroke-dashoffset" values="263.9;0" dur="1.2s" begin="0.5s" fill="freeze"/>
      </circle>
      <text x="385" y="118" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="30" font-weight="700"
            fill="#e6edf3" opacity="0">1
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
      </text>
      <text x="385" y="176" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13" fill="#8b949e" opacity="0">stars earned
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
      </text>
    </g>

    <g>
      <circle cx="615" cy="108" r="42" fill="none" stroke="#161b22" stroke-width="7"/>
      <circle cx="615" cy="108" r="42" fill="none" stroke="#3fb950" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 615 108)">
        <animate attributeName="stroke-dashoffset" values="263.9;0" dur="1.2s" begin="0.75s" fill="freeze"/>
      </circle>
      <text x="615" y="118" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="30" font-weight="700"
            fill="#e6edf3" opacity="0">3
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.35s" fill="freeze"/>
      </text>
      <text x="615" y="176" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13" fill="#8b949e" opacity="0">followers
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.55s" fill="freeze"/>
      </text>
    </g>

    <g>
      <circle cx="845" cy="108" r="42" fill="none" stroke="#161b22" stroke-width="7"/>
      <circle cx="845" cy="108" r="42" fill="none" stroke="#58a6ff" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 845 108)">
        <animate attributeName="stroke-dashoffset" values="263.9;0" dur="1.2s" begin="1.0s" fill="freeze"/>
      </circle>
      <text x="845" y="118" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="30" font-weight="700"
            fill="#e6edf3" opacity="0">5
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
      </text>
      <text x="845" y="176" text-anchor="middle" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13" fill="#8b949e" opacity="0">following
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/>
      </text>
    </g>
    <rect x="-180" y="0" width="180" height="210" fill="#58a6ff" opacity="0.035">
      <animate attributeName="x" values="-180;1000" dur="6s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
