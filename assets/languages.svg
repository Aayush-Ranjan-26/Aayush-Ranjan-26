<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 242" width="1000" height="242" role="img" aria-label="Language mix">
  <defs><clipPath id="lp"><rect width="1000" height="242" rx="14"/></clipPath></defs>
  <g clip-path="url(#lp)">
    <rect width="1000" height="242" rx="14" fill="#0d1117"/>
    <rect x="0.5" y="0.5" width="999" height="241" rx="14" fill="none" stroke="#21304a"/>
    <text x="32" y="38" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13" fill="#6e7681">$ gh api users/ --languages --by-repo</text>

    <text x="32" y="75" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13.5" fill="#c9d1d9">Python</text>
    <rect x="300" y="66" width="560" height="9" rx="4.5" fill="#161b22"/>
    <rect x="300" y="66" width="0" height="9" rx="4.5" fill="#3fb950">
      <animate attributeName="width" values="0;311.1" dur="1.2s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="882" y="75" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="12" fill="#8b949e" opacity="0">56%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    </text>

    <text x="32" y="113" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13.5" fill="#c9d1d9">JavaScript</text>
    <rect x="300" y="104" width="560" height="9" rx="4.5" fill="#161b22"/>
    <rect x="300" y="104" width="0" height="9" rx="4.5" fill="#58a6ff">
      <animate attributeName="width" values="0;124.4" dur="1.2s" begin="0.35s" fill="freeze"/>
    </rect>
    <text x="882" y="113" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="12" fill="#8b949e" opacity="0">22%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.45s" fill="freeze"/>
    </text>

    <text x="32" y="151" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13.5" fill="#c9d1d9">Jupyter Notebook</text>
    <rect x="300" y="142" width="560" height="9" rx="4.5" fill="#161b22"/>
    <rect x="300" y="142" width="0" height="9" rx="4.5" fill="#3fb950">
      <animate attributeName="width" values="0;62.2" dur="1.2s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="882" y="151" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="12" fill="#8b949e" opacity="0">11%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
    </text>

    <text x="32" y="189" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="13.5" fill="#c9d1d9">HTML</text>
    <rect x="300" y="180" width="560" height="9" rx="4.5" fill="#161b22"/>
    <rect x="300" y="180" width="0" height="9" rx="4.5" fill="#58a6ff">
      <animate attributeName="width" values="0;62.2" dur="1.2s" begin="0.65s" fill="freeze"/>
    </rect>
    <text x="882" y="189" font-family='"SFMono-Regular", Consolas, Menlo, monospace' font-size="12" fill="#8b949e" opacity="0">11%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.75s" fill="freeze"/>
    </text>
  </g>
</svg>
